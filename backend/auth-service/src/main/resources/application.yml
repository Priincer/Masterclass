spring:
  application:
    name: auth-service

  profiles:
    # Wenn kein Profil gesetzt wurde → local ist aktiv
    default: local

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: 3600000          # 1 Stunde
    refresh-expiration-millis: 2592000000 # 30 Tage

logging:
  level:
    org.hibernate.SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true